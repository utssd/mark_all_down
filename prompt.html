<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Open File by Path</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .prompt-header {
      padding: 12px 16px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .prompt-body { padding: 12px 16px; flex: 1; }
    .prompt-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 14px;
    }
    #prompt-input.settings-input { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="prompt-header">Open File by Path</div>
  <div class="prompt-body">
    <label class="open-by-path-label" for="prompt-input">File path (relative or absolute)</label>
    <input id="prompt-input" type="text" class="settings-input" spellcheck="false"
           placeholder="e.g. docs/research.md or /home/me/notes.md" />
    <div class="open-by-path-source">
      <label><input type="radio" name="prompt-source" value="auto" checked /> <span id="prompt-auto-label">Auto</span></label>
      <label><input type="radio" name="prompt-source" value="local" /> Local</label>
    </div>
    <p class="open-by-path-hint">Auto follows the active terminal's Claude (local, or its SSH host). Local always uses this computer. Relative paths resolve against that working directory.</p>
    <p id="prompt-error" class="open-from-ssh-error hidden"></p>
  </div>
  <div class="prompt-footer">
    <button id="btn-prompt-cancel" class="btn btn-secondary">Cancel</button>
    <button id="btn-prompt-open" class="btn btn-primary">Open</button>
  </div>

  <script src="prompt-renderer.js"></script>
</body>
</html>
